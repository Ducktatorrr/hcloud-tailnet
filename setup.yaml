- name: Provision Hetzner VPS
  hosts: localhost
  gather_facts: false
  vars_files:
    - config.yaml
    - secrets.yaml
  vars:
    access_mode: auto
    tailnet_host: "{{ server_name }}"
    ssh_public_key: "{{ lookup('file', ssh_public_key_file | expanduser) | trim }}"
  tasks:
    - name: Check required inputs
      ansible.builtin.assert:
        that:
          - hcloud_token | length > 0
          - tailscale_auth_key | length > 0
          - access_mode in ['auto', 'public', 'tailnet']
          - ssh_public_key is match('^ssh-(ed25519|rsa) ')
          - admin_user is match('^[a-z_][a-z0-9_-]*$')
          - server_name is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: Fill in secrets.yaml and check config.yaml before running setup.

    - name: Check local Tailscale connection
      ansible.builtin.command: tailscale status --json
      register: local_tailscale
      changed_when: false
      failed_when: false

    - name: Require active local tailnet
      ansible.builtin.assert:
        that: local_tailscale.rc == 0 and (local_tailscale.stdout | from_json).BackendState == 'Running'
        success_msg: Local Tailscale is connected.
        fail_msg: Connect this computer to Tailscale before running setup.

    - name: Look up existing server
      hetzner.hcloud.server_info:
        name: "{{ server_name }}"
        api_token: "{{ hcloud_token }}"
      register: existing_server

    - name: Look up existing firewall
      hetzner.hcloud.firewall_info:
        name: "{{ server_name }}-firewall"
        api_token: "{{ hcloud_token }}"
      register: existing_firewall

    - name: Choose connection path
      ansible.builtin.set_fact:
        public_bootstrap: "{{ access_mode == 'public' or (access_mode == 'auto' and (existing_server.hcloud_server_info | length == 0 or (existing_firewall.hcloud_firewall_info | length > 0 and existing_firewall.hcloud_firewall_info[0].rules | length > 0))) }}"

    - name: Detect current public IPv4
      ansible.builtin.uri:
        url: https://ipv4.icanhazip.com/
        return_content: true
      register: public_ip
      when: public_bootstrap and bootstrap_ssh_cidr | length == 0

    - name: Create or update firewall
      hetzner.hcloud.firewall:
        name: "{{ server_name }}-firewall"
        api_token: "{{ hcloud_token }}"
        rules: "{{ [{'direction': 'in', 'protocol': 'tcp', 'port': '22', 'source_ips': [(bootstrap_ssh_cidr or (public_ip.content | trim ~ '/32'))]}] if public_bootstrap else [] }}"

    - name: Check existing Hetzner SSH key
      hetzner.hcloud.ssh_key_info:
        name: "{{ hetzner_ssh_key_name }}"
        api_token: "{{ hcloud_token }}"
      register: existing_ssh_key
      when: hetzner_ssh_key_name | length > 0

    - name: Verify existing Hetzner SSH key
      ansible.builtin.assert:
        that: existing_ssh_key.hcloud_ssh_key_info | length == 1 and existing_ssh_key.hcloud_ssh_key_info[0].public_key.split()[:2] == ssh_public_key.split()[:2]
        fail_msg: The named Hetzner SSH key must match ssh_public_key_file.
      when: hetzner_ssh_key_name | length > 0

    - name: Register SSH public key
      hetzner.hcloud.ssh_key:
        name: "{{ server_name }}-admin"
        public_key: "{{ ssh_public_key }}"
        api_token: "{{ hcloud_token }}"
      when: hetzner_ssh_key_name | length == 0

    - name: Create or update server
      hetzner.hcloud.server:
        name: "{{ server_name }}"
        server_type: "{{ server_type }}"
        location: "{{ server_location }}"
        image: "{{ server_image }}"
        ssh_keys:
          - "{{ hetzner_ssh_key_name or (server_name ~ '-admin') }}"
        firewalls:
          - "{{ server_name }}-firewall"
        user_data: "{{ lookup('template', 'cloud-init.yaml.j2') }}"
        state: present
        api_token: "{{ hcloud_token }}"
      register: server

    - name: Add server to this run
      ansible.builtin.add_host:
        name: vps_target
        ansible_host: "{{ server.hcloud_server.ipv4_address if public_bootstrap else tailnet_host }}"
        ansible_user: "{{ admin_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key_file | expanduser }}"
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o BatchMode=yes
        private_key_file: "{{ ssh_private_key_file | expanduser }}"
        server_name: "{{ server_name }}"
        public_bootstrap: "{{ public_bootstrap }}"

- name: Configure VPS
  hosts: vps_target
  gather_facts: false
  become: true
  vars_files:
    - secrets.yaml
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - unattended-upgrades
        update_cache: true
        state: present

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: '0644'

    - name: Configure SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-vps.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH

    - name: Apply SSH configuration
      ansible.builtin.meta: flush_handlers

    - name: Check whether Tailscale is installed
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary

    - name: Download Tailscale installer
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: '0700'
      when: not tailscale_binary.stat.exists

    - name: Install Tailscale
      ansible.builtin.command: /tmp/tailscale-install.sh
      when: not tailscale_binary.stat.exists

    - name: Check Tailscale state
      ansible.builtin.command: tailscale status --json
      register: tailscale_state
      changed_when: false
      failed_when: false
      no_log: true

    - name: Join tailnet
      when: tailscale_state.rc != 0 or (tailscale_state.stdout | from_json).BackendState != 'Running'
      block:
        - name: Store one-time auth key briefly
          ansible.builtin.copy:
            dest: /run/tailscale-auth-key
            content: "{{ tailscale_auth_key }}"
            mode: '0600'
          no_log: true

        - name: Authenticate Tailscale
          ansible.builtin.command:
            argv:
              - tailscale
              - up
              - --auth-key=file:/run/tailscale-auth-key
              - "--hostname={{ server_name }}"
          no_log: true
      always:
        - name: Remove auth key file
          ansible.builtin.file:
            path: /run/tailscale-auth-key
            state: absent

    - name: Read Tailscale IPv4
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false

    - name: Verify fresh SSH login over Tailscale
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - ConnectTimeout=15
          - -i
          - "{{ private_key_file }}"
          - "{{ ansible_user }}@{{ tailscale_ip.stdout | trim }}"
          - id
          - -un
      delegate_to: localhost
      become: false
      register: private_ssh
      until: private_ssh.rc == 0
      retries: 6
      delay: 5
      changed_when: false

    - name: Check private SSH user
      ansible.builtin.assert:
        that: private_ssh.stdout | trim == ansible_user

    - name: Close public SSH
      hetzner.hcloud.firewall:
        name: "{{ server_name }}-firewall"
        rules: []
        api_token: "{{ hcloud_token }}"
      delegate_to: localhost
      become: false
      when: public_bootstrap

    - name: VPS READY - CONNECT OVER TAILSCALE
      ansible.builtin.debug:
        msg:
          - "Server: {{ server_name }}"
          - "SSH: ssh -i {{ private_key_file | quote }} {{ ansible_user }}@{{ tailscale_ip.stdout | trim }}"
          - "Public SSH: closed"

  handlers:
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
